<style>
  .lh-hero { display:flex; align-items:center; gap:14px; background:var(--card); border:1px solid var(--border-gold); border-radius:var(--radius); padding:18px 20px; box-shadow:var(--shadow); margin-bottom:18px; }
  .lh-hero .f { font-size:2.6rem; line-height:1; }
  .lh-hero b { font-size:1.3rem; display:block; }
  .lh-hero small { color:var(--text-faint); font-weight:700; }

  .lh-tabs { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
  .lh-tab { background:var(--card-strong); border:1px solid var(--border); border-radius:999px; padding:7px 16px; font-weight:800; font-size:.86rem; cursor:pointer; color:var(--text-dim); }
  .lh-tab.active { background:var(--grad-fire); color:#000; border-color:transparent; }
  .lh-pane { display:none; } .lh-pane.active { display:block; }

  /* جدول الترتيب */
  .tbl-wrap { overflow-x:auto; border:1px solid var(--border); border-radius:14px; }
  table.tbl { width:100%; border-collapse:collapse; min-width:560px; font-size:.86rem; }
  table.tbl th, table.tbl td { padding:10px 8px; text-align:center; border-bottom:1px solid var(--border); white-space:nowrap; }
  table.tbl th { color:var(--text-faint); font-weight:800; font-size:.74rem; background:var(--card-strong); }
  table.tbl td.team { text-align:start; }
  table.tbl .tm { display:flex; align-items:center; gap:8px; font-weight:800; }
  table.tbl .tm img { width:22px; height:22px; object-fit:contain; }
  table.tbl .rk { font-weight:900; color:var(--text-faint); }
  table.tbl .pts { font-weight:900; color:var(--gold); }
  table.tbl tr, table.tbl tbody tr:hover td { background:rgba(255,255,255,.02); }
  .form-b { display:inline-flex; gap:3px; }
  .form-b i { width:7px; height:7px; border-radius:50%; display:inline-block; }
  .fw{background:#2fcf6f} .fd{background:#c9a23a} .fl{background:#e0533d}

  /* المباريات */
  .fx { display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:11px 14px; margin-bottom:9px; }
  .fx .dt { color:var(--text-faint); font-weight:800; font-size:.74rem; min-width:84px; }
  .fx .pair { flex:1; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:8px; }
  .fx .t { display:flex; align-items:center; gap:7px; font-weight:800; font-size:.9rem; min-width:0; }
  .fx .t.away { flex-direction:row-reverse; text-align:start; }
  .fx .t img { width:22px; height:22px; object-fit:contain; flex-shrink:0; }
  .fx .t span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .fx .sc { font-weight:900; font-size:1.05rem; min-width:54px; text-align:center; }
  .fx .sc small { display:block; font-size:.66rem; color:var(--text-faint); font-weight:700; }
  .fx .live { color:#ff5a5a; }
  .fx-head { font-weight:900; margin:18px 0 12px; font-size:1.02rem; }

  .lh-empty { text-align:center; padding:40px 18px; color:var(--text-dim); }
  .lh-empty .ico { font-size:2.6rem; margin-bottom:10px; }
  .lh-empty h3 { color:var(--text); margin-bottom:8px; }
  .lh-empty p { max-width:460px; margin:0 auto; line-height:1.7; font-size:.9rem; }
</style>

<style>
  .ln-bar { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:16px; }
  .ln-live { display:inline-flex; align-items:center; gap:8px; font-weight:800; color:var(--text-dim); font-size:.86rem; }
  .ln-dot { width:10px; height:10px; border-radius:50%; background:#ff3b3b; box-shadow:0 0 0 0 rgba(255,59,59,.6); animation:lnpulse 1.6s infinite; }
  @keyframes lnpulse { 0%{box-shadow:0 0 0 0 rgba(255,59,59,.6)} 70%{box-shadow:0 0 0 9px rgba(255,59,59,0)} 100%{box-shadow:0 0 0 0 rgba(255,59,59,0)} }
  .ln-updated { color:var(--text-faint); font-size:.76rem; font-weight:700; }

  .ln-group { margin-top:22px; }
  .ln-group-head { display:flex; align-items:center; gap:9px; margin-bottom:12px; font-weight:900; font-size:1rem; }
  .ln-group-head img { width:26px; height:26px; object-fit:contain; border-radius:5px; background:#fff; padding:2px; }
  .ln-group-head small { color:var(--text-faint); font-weight:700; font-size:.74rem; }

  .ln-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:14px; }
  .ln-card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px 16px; transition:.2s; }
  .ln-card:hover { border-color:var(--border-gold); transform:translateY(-2px); }
  .ln-row { display:grid; grid-template-columns:1fr auto; align-items:center; gap:10px; }
  .ln-team { display:flex; align-items:center; gap:9px; font-weight:800; font-size:.96rem; min-width:0; }
  .ln-team img { width:26px; height:26px; object-fit:contain; flex-shrink:0; }
  .ln-team span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ln-score { font-size:1.5rem; font-weight:900; min-width:30px; text-align:center; }
  .ln-sep { height:1px; background:var(--border); margin:9px 0; }
  .ln-min { display:inline-flex; align-items:center; gap:6px; margin-top:11px; font-size:.78rem; font-weight:800; color:#ff5a5a; }
  .ln-min .d { width:7px; height:7px; border-radius:50%; background:#ff3b3b; animation:lnpulse 1.6s infinite; }
  .ln-ht { color:var(--gold); }

  .ln-empty { text-align:center; padding:48px 18px; color:var(--text-dim); }
  .ln-empty .ico { font-size:3rem; margin-bottom:12px; }
  .ln-empty h3 { font-size:1.15rem; margin-bottom:8px; color:var(--text); }
  .ln-empty p { max-width:420px; margin:0 auto; line-height:1.7; font-size:.9rem; }

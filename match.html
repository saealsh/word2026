<style>
  .md-hero { background: var(--card); border: 1px solid var(--border-gold); border-radius: var(--radius); padding: 22px; box-shadow: var(--shadow); }
  .md-top { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; color: var(--text-dim); font-size: .86rem; font-weight: 700; margin-bottom: 16px; }
  .md-top .chip-mini { background: var(--card-strong); border: 1px solid var(--border); border-radius: 999px; padding: 4px 12px; }
  .md-vs { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; }
  .md-team { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
  .md-team img { width: 92px; height: 66px; object-fit: cover; border-radius: 8px; box-shadow: var(--shadow); }
  .md-team b { font-size: 1.15rem; }
  .md-team small { color: var(--text-faint); font-weight: 700; }
  .md-center { text-align: center; min-width: 88px; }
  .md-center .vs { font-size: 1.4rem; font-weight: 900; color: var(--text-faint); }
  .md-center .t { display: block; font-size: 1.6rem; font-weight: 900; }
  .md-center .tz { display: block; font-size: .72rem; color: var(--text-faint); font-weight: 700; }
  .md-score { font-size: 2.2rem; font-weight: 900; }

  .md-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 22px; }
  @media (max-width: 760px) { .md-grid { grid-template-columns: 1fr; } .md-team img { width: 72px; height: 52px; } }

  .panel { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 18px; }
  .panel h3 { font-size: 1.05rem; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }

  /* مقارنة إحصائية */
  .cmp-row { margin: 12px 0; }
  .cmp-head { display: flex; justify-content: space-between; font-size: .8rem; color: var(--text-dim); font-weight: 800; margin-bottom: 5px; }
  .cmp-bar { display: flex; height: 12px; border-radius: 999px; overflow: hidden; background: rgba(255,255,255,.08); }
  .cmp-bar i { height: 100%; display: block; }
  .cmp-bar .a { background: var(--grad-fire); }
  .cmp-bar .b { background: var(--grad-cool); opacity: .8; }
  .cmp-text { display: flex; justify-content: space-between; font-size: .82rem; font-weight: 800; padding: 7px 0; border-bottom: 1px dashed var(--border); }
  .cmp-text span:nth-child(2) { color: var(--text-faint); font-weight: 700; }

  /* سجل المواجهات */
  .h2h { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; text-align: center; }
  .h2h div { background: var(--card-strong); border: 1px solid var(--border); border-radius: 11px; padding: 12px 6px; }
  .h2h b { display: block; font-size: 1.7rem; font-weight: 900; }
  .h2h small { color: var(--text-faint); font-weight: 700; font-size: .76rem; }
  .h2h-note { margin-top: 12px; color: var(--text-dim); font-size: .86rem; line-height: 1.6; }

  /* النجوم */
  .squad { display: flex; flex-direction: column; gap: 9px; }
  .player { display: flex; align-items: center; gap: 11px; background: var(--card-strong); border: 1px solid var(--border); border-radius: 11px; padding: 9px 12px; }
  .player .pos { width: 38px; height: 38px; border-radius: 9px; background: var(--grad-fire); color: #000; display: grid; place-items: center; font-weight: 900; font-size: .72rem; flex-shrink: 0; }
  .player .pn { font-weight: 800; }
  .player .pc { color: var(--text-faint); font-size: .78rem; font-weight: 700; }
  .squad-head { display: flex; align-items: center; gap: 9px; margin-bottom: 12px; font-weight: 900; }
  .squad-head img { width: 34px; height: 25px; border-radius: 4px; object-fit: cover; }
  .coach-line { color: var(--text-dim); font-size: .84rem; font-weight: 700; margin-bottom: 12px; }

  .md-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
  .ctx-match { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 4px; border-bottom: 1px dashed var(--border); font-weight: 700; font-size: .88rem; }
  .ctx-match .ct { display: flex; align-items: center; gap: 6px; }
  .ctx-match img { width: 22px; height: 16px; border-radius: 3px; object-fit: cover; }
  .ctx-time { color: var(--text-faint); font-size: .78rem; font-weight: 700; }

<style>
  .champ-pick { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .champ-pick select { flex: 1; min-width: 200px; font-family: var(--font); background: var(--card); border: 1px solid var(--border-gold); color: var(--text); padding: 12px 15px; border-radius: 12px; font-weight: 800; font-size: 1.05rem; }
  .champ-badge { display: flex; align-items: center; gap: 10px; font-weight: 900; }
  .champ-badge img { width: 40px; height: 30px; object-fit: cover; border-radius: 5px; box-shadow: var(--shadow); }
  .pred-progress { background: rgba(255,255,255,.08); border-radius: 999px; height: 14px; overflow: hidden; margin: 8px 0; }
  .pred-progress > span { display: block; height: 100%; background: var(--grad-fire); transition: width .5s; }
  .pred-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding: 9px 6px; border-bottom: 1px solid var(--border); }
  .pred-team { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: .92rem; }
  .pred-team.away { flex-direction: row-reverse; }
  .pred-team img { width: 30px; height: 22px; object-fit: cover; border-radius: 4px; }
  .pred-choices { display: flex; gap: 4px; }
  .pred-choices button { font-family: var(--font); width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--border); background: var(--card); color: var(--text-dim); font-weight: 900; cursor: pointer; transition: .15s; }
  .pred-choices button:hover { color: var(--text); border-color: var(--border-gold); }
  .pred-choices button.sel { background: var(--grad-fire); color: #000; border-color: transparent; }
  .pred-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }

  /* شارة تقدّم لكل مجموعة */
  .group-card h3 { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .gp-badge { font-size: .72rem; font-weight: 800; color: var(--text-faint); background: var(--card-strong); border: 1px solid var(--border); padding: 3px 9px; border-radius: 999px; }
  .gp-badge.done { color: #000; background: var(--grad-fire); border-color: transparent; }

  /* احتفال الاكتمال (قُصاصات) */
  .confetti { position: fixed; inset: 0; pointer-events: none; z-index: 9999; overflow: hidden; }
  .confetti i { position: absolute; top: -12px; width: 9px; height: 14px; opacity: .9; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(105vh) rotate(720deg); opacity: 1; } }
</style>
